[package]
name = "bbhunter"
version = "0.1.0"
edition = "2021"
description = "All-in-one bug bounty recon toolkit for authorized targets"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
fastrand = "2"
futures = "0.3"
globset = "0.4"
hickory-resolver = "0.24"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "stream",
    "json",
    "cookies",
] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
